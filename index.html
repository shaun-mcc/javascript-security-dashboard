<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">

    <title>Security Findings Dashboard</title>

    <script src="app.js" defer></script>
</head>
<body>
    <h1>Security Findings Dashboard</h1>
    <p>Educational dashboard using functional security findings</p>

    <div class="filter-controls">
        <label for="severity-filter">Severity:</label>
        <select id="severity-filter">
            <option value="All">All severities</option>
            <option value="High">High</option>
            <option value="Medium">Medium</option>
            <option value="Low">Low</option>
        </select>

        <label for="status-filter">Status</label>
        <select id="status-filter">
            <option value="All">All statuses</option>
            <option value="Open">Open</option>
            <option value="Closed">Closed</option>
        </select>

        <label for="asset-search">Search assets:</label>
        <input
            type="search"
            id="asset-search"
            placeholder="Example: lab-server"
        >
    </div>

    <p id="results-count" aria-live="polite"></p>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Finding</th>
                    <th scope="col">Asset</th>
                    <th scope="col">Severity</th>
                    <th scope="col">Status</th>
                </tr>
            </thead>

            <tbody id="findings-body"></tbody>
        </table>
    </div>
</body>
</html>
